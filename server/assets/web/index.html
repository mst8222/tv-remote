<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TV Remote</title>
<meta name="theme-color" content="#0A0E14">
<meta name="description" content="TV Remote web remote for the TV box">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TV Remote">
<meta name="format-detection" content="telephone=no">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">TV Remote</div>
    <div id="status" class="status">—</div>
  </header>

  <button id="devBtn" class="devBar" hidden>
    <span class="devBarLabel" data-i18n="devicesTitle">设备</span>
    <span id="devName" class="devBarName"></span>
    <span class="devBarChev">⌄</span>
  </button>

  <p id="secureHint" class="hint" hidden></p>
  <p id="iosHint" class="hint" hidden></p>

  <section id="pairCard" class="card">
    <h2 data-i18n="pairTitle">连接电视盒子</h2>
    <p class="sub" data-i18n="pairSub">输入电视上显示的 6 位配对码</p>
    <input id="code" class="code" inputmode="numeric" maxlength="6"
           autocomplete="one-time-code" placeholder="000000"
           data-i18n-ph="codePlaceholder">
    <button id="pairBtn" class="primary">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 13.5a5 5 0 0 0 7.1 0l1.4-1.4a5 5 0 0 0-7.1-7.1L11 5.9"/><path d="M13.5 10.5a5 5 0 0 0-7.1 0L5 11.9a5 5 0 0 0 7.1 7.1l1.4-1.4"/></svg>
      <span data-i18n="pairBtn">配对</span>
    </button>
    <button id="addOtherBtn" class="linkBtn">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      <span data-i18n="addOther">添加其它盒子</span>
    </button>
    <p id="pairMsg" class="msg"></p>
  </section>

  <section id="remoteCard" class="card" hidden>
    <div class="cardHead">
      <h2 data-i18n="remoteTitle">遥控器</h2>
    </div>
    <div class="seg">
      <button id="segDpad" class="on">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M3 12h18"/><path d="M12 3l-2 2M12 3l2 2M12 21l-2-2M12 21l2-2M3 12l2-2M3 12l2 2M21 12l-2-2M21 12l-2 2"/></svg>
        <span data-i18n="modeDpad">方向盘</span>
      </button>
      <button id="segPad">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.5"/><path d="M5.6 5.6a9 9 0 0 0 0 12.8M18.4 5.6a9 9 0 0 1 0 12.8"/></svg>
        <span data-i18n="modeTouch">触摸</span>
      </button>
      <button id="segMouse">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="3" width="10" height="18" rx="5"/><path d="M12 7v4"/></svg>
        <span data-i18n="modeMouse">鼠标</span>
      </button>
    </div>
    <div id="dpad" class="dpad">
      <button class="d up" data-key="19" aria-label="up">▲</button>
      <button class="d left" data-key="21" aria-label="left">◀</button>
      <button id="okBtn" class="ok" aria-label="ok">OK</button>
      <button class="d right" data-key="22" aria-label="right">▶</button>
      <button class="d down" data-key="20" aria-label="down">▼</button>
    </div>
    <div id="touchpad" class="touchpad" hidden>
      <span id="padTip1" class="padTip">点按对应位置 · 长按菜单</span>
      <span id="padTip2" class="padTip">上下滑动列表</span>
    </div>
    <div class="row sys">
      <button data-key="4" aria-label="back">←</button>
      <button data-key="3" aria-label="home">⌂</button>
      <button data-key="82" aria-label="menu">≡</button>
      <button id="powerBtn" class="power" data-key="26" aria-label="电源">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v9"/><path d="M6.4 6.4a8 8 0 1 0 11.2 0"/></svg>
        <span data-i18n="power">电源</span>
      </button>
    </div>
    <div class="row vol">
      <div class="volPill">
        <button data-key="25" aria-label="volume down">−</button>
        <span class="volLabel" data-i18n="volume">音量</span>
        <button data-key="24" aria-label="volume up">+</button>
      </div>
      <button class="muteKey" data-key="164" aria-label="静音">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6.5 9H3v6h3.5L11 19z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
        <span data-i18n="mute">静音</span>
      </button>
    </div>
  </section>

  <section id="inputCard" class="card" hidden>
    <h2 data-i18n="inputTitle">文字输入</h2>
    <div class="inputRow">
      <input id="text" data-i18n-ph="textPlaceholder" placeholder="输入文字">
      <button id="sendBtn" class="primary small">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 3 10.5 13.5"/><path d="M21 3l-7 18-3.5-7.5L3 10z"/></svg>
        <span data-i18n="send">发送</span>
      </button>
    </div>
  </section>

  <section id="appsCard" class="card" hidden>
    <h2 data-i18n="appsTitle">应用</h2>
    <div id="apps" class="apps"></div>
  </section>

  <!-- SPEC-040 APK 推送安装 -->
  <section id="apkCard" class="card" hidden>
    <h2 data-i18n="apkTitle">安装 APK</h2>
    <button id="apkPickBtn" class="primary">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M12 18v-6M9.5 14.5 12 12l2.5 2.5"/></svg>
      <span data-i18n="apkPickFile">选择 APK 文件</span>
    </button>
    <input id="apkFile" type="file" accept=".apk,application/vnd.android.package-archive" hidden>
    <p class="sub" data-i18n="apkUrlLabel">或填写 APK 下载链接：</p>
    <div class="inputRow">
      <input id="apkUrl" autocomplete="off" placeholder="https://..."
             data-i18n-ph="apkUrlHint">
      <button id="apkUrlBtn" class="primary small">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 3 10.5 13.5"/><path d="M21 3l-7 18-3.5-7.5L3 10z"/></svg>
        <span data-i18n="apkSendUrl">发送</span>
      </button>
    </div>
    <p id="apkMsg" class="msg"></p>
  </section>

  <section id="offlineCard" class="card warn" hidden>
    <h2 data-i18n="offlineTitle">未连接到盒子</h2>
    <p class="sub" data-i18n="offlineMsg"></p>
    <button id="retryBtn" class="primary">
      <svg class="ico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 4v5h-5"/></svg>
      <span data-i18n="retry">重试连接</span>
    </button>
  </section>

  <footer class="foot" data-i18n="foot">TV Remote Service · 局域网直连</footer>
</div>

<div id="devMask" class="mask" hidden></div>
<section id="devSheet" class="sheet" hidden>
  <div class="sheetHead">
    <h2 data-i18n="devicesTitle">设备</h2>
    <button id="devClose" class="iconBtn" aria-label="close">✕</button>
  </div>
  <div id="devList" class="devList"></div>
  <button id="scanBtn" class="primary" data-i18n="scanAdd" hidden>扫码添加</button>
  <p id="scanHint" class="hint" hidden></p>
  <div class="addBox">
    <p class="sub" data-i18n="manualAdd">手动添加</p>
    <div class="addRow">
      <input id="devAddr" autocomplete="off" placeholder="192.168.3.125"
             data-i18n-ph="addrPlaceholder">
      <input id="devCode" inputmode="numeric" maxlength="6" autocomplete="one-time-code"
             placeholder="000000">
    </div>
    <button id="addBtn" class="primary" data-i18n="addBtn">添加</button>
    <p id="devMsg" class="msg"></p>
  </div>
</section>

<div id="scanOverlay" class="mask scanMask" hidden>
  <div class="scanBox">
    <video id="scanVideo" playsinline muted></video>
    <p class="hint" data-i18n="scanTip">对准电视上的二维码</p>
    <button id="scanCancel" class="primary small" data-i18n="cancel">取消</button>
  </div>
</div>

<div id="toast" class="toast" hidden></div>
<script src="/app.js"></script>
</body>
</html>
